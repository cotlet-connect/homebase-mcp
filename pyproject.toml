[project]
name = "homebase-mcp"
version = "1.1.0"
description = "Connect Homebase to Claude Code, ChatGPT and any AI agent through Cotlet.dev, a hosted MCP server. No Homebase API key needed."
readme = "README.md"
license = "Elastic-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Cotlet.dev", email = "contact@cotlet.dev" }]
keywords = ["homebase", "homebase api", "homebase mcp", "mcp server", "claude", "chatgpt", "ai agent", "cotlet"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Office/Business"]
dependencies = []

[project.urls]
Homepage = "https://cotlet.dev/integrations/mcp/homebase?utm_source=pypi&utm_medium=package&utm_campaign=homebase"
Source = "https://github.com/cotlet-connect/homebase-mcp"

[project.scripts]
homebase-mcp = "homebase_agent:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"homebase_agent.py" = "homebase_agent.py"

[tool.hatch.build.targets.sdist]
include = ["homebase_agent.py", "README.md", "LICENSE", "mcp.json", "Dockerfile", "glama.json", "skills", "examples", ".cursor"]
